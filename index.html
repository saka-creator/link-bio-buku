<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saka (@sakayst) - Promo Buku</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#E5472A' }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F9FAFB] text-gray-800 font-sans min-h-screen flex justify-center sm:py-10">

    <!-- Main Container -->
    <main class="w-full max-w-md bg-white sm:rounded-3xl sm:shadow-xl sm:border sm:border-gray-100 p-6 min-h-screen sm:min-h-0 relative flex flex-col">
        
        <!-- Profile Section -->
        <div class="text-center mt-4 mb-7">
            <div class="relative inline-block">
                <img src="foto_profil.png" 
                     onerror="this.onerror=null; this.src='https://i.ibb.co.com/QjQXLfd8/ppsyst.png';" 
                     class="w-24 h-24 mx-auto rounded-full border-4 border-white shadow-md object-cover bg-gray-100" 
                     alt="Profile Saka">
            </div>
            <h1 class="text-xl font-bold mt-3 text-gray-900">Saka <span class="text-gray-400 font-normal text-sm">(@sakayst)</span></h1>
            <p class="text-sm text-gray-600 mt-2 px-3 leading-relaxed">Klaim diskon khusus pembaca Threads untuk buku-buku pilihan di bawah ini. 👇</p>
        </div>

        <!-- Book Links List (Urutan: NAK, AMD, ATMD, MSISK) -->
        <div class="flex flex-col gap-3.5 pb-8">
            
            <!-- 1. Nakhoda Anak Kita (NAK) -->
            <button onclick="openModal('Nakhoda Anak Kita', 'https://cart.locrepublishing.com/order-nak?discount_code=SAKA-B', 'SAKA-B', 'Cover_NAK.jpg', 'https://i.ibb.co.com/HL9qvC7t/NAK.jpg')" 
                class="group flex items-center w-full bg-white border-2 border-gray-100 p-3 rounded-2xl text-left hover:border-brand hover:shadow-md hover:bg-orange-50/30 transition-all duration-200">
                <img src="Cover_NAK.jpg" 
                     onerror="this.onerror=null; this.src='https://i.ibb.co.com/HL9qvC7t/NAK.jpg';" 
                     alt="Nakhoda Anak Kita" 
                     class="w-[68px] h-[100px] object-cover rounded-xl shadow-sm shrink-0 bg-gray-100">
                <div class="ml-4 flex-1">
                    <span class="inline-block text-[11px] font-semibold uppercase tracking-wider text-brand bg-orange-50 px-2 py-0.5 rounded-md mb-1">Kode: SAKA-B</span>
                    <h3 class="font-bold text-gray-900 text-[15px] leading-snug group-hover:text-brand transition-colors">Nakhoda Anak Kita</h3>
                    <p class="text-xs text-gray-500 font-medium mt-1">Panduan Keluarga • Promo Diskon</p>
                </div>
                <div class="px-2 text-gray-300 group-hover:text-brand group-hover:translate-x-0.5 transition-all shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </button>

            <!-- 2. Andai Menikah Dengannya (AMD) -->
            <button onclick="openModal('Andai Menikah Dengannya', 'https://cart.locrepublishing.com/order-amd?discount_code=SAKA-A', 'SAKA-A', 'Cover_AMD.jpg', 'https://i.ibb.co.com/FbrQrzLY/AMD.jpg')" 
                class="group flex items-center w-full bg-white border-2 border-gray-100 p-3 rounded-2xl text-left hover:border-brand hover:shadow-md hover:bg-orange-50/30 transition-all duration-200">
                <img src="Cover_AMD.jpg" 
                     onerror="this.onerror=null; this.src='https://i.ibb.co.com/FbrQrzLY/AMD.jpg';" 
                     alt="Andai Menikah Dengannya" 
                     class="w-[68px] h-[100px] object-cover rounded-xl shadow-sm shrink-0 bg-gray-100">
                <div class="ml-4 flex-1">
                    <span class="inline-block text-[11px] font-semibold uppercase tracking-wider text-brand bg-orange-50 px-2 py-0.5 rounded-md mb-1">Kode: SAKA-A</span>
                    <h3 class="font-bold text-gray-900 text-[15px] leading-snug group-hover:text-brand transition-colors">Andai Menikah Dengannya</h3>
                    <p class="text-xs text-gray-500 font-medium mt-1">Promo Harga Spesial</p>
                </div>
                <div class="px-2 text-gray-300 group-hover:text-brand group-hover:translate-x-0.5 transition-all shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </button>

            <!-- 3. Andai Tidak Menikah Dengannya (ATMD) -->
            <button onclick="openModal('Andai Tidak Menikah Dengannya', 'https://cart.locrepublishing.com/order-atmd?discount_code=SAKA-A', 'SAKA-A', 'Cover_ATMD.jpg', 'https://i.ibb.co.com/KcJmPkPC/6258126152299909471.jpg')" 
                class="group flex items-center w-full bg-white border-2 border-gray-100 p-3 rounded-2xl text-left hover:border-brand hover:shadow-md hover:bg-orange-50/30 transition-all duration-200">
                <img src="Cover_ATMD.jpg" 
                     onerror="this.onerror=null; this.src='https://i.ibb.co.com/KcJmPkPC/6258126152299909471.jpg';" 
                     alt="Andai Tidak Menikah Dengannya" 
                     class="w-[68px] h-[100px] object-cover rounded-xl shadow-sm shrink-0 bg-gray-100">
                <div class="ml-4 flex-1">
                    <span class="inline-block text-[11px] font-semibold uppercase tracking-wider text-brand bg-orange-50 px-2 py-0.5 rounded-md mb-1">Kode: SAKA-A</span>
                    <h3 class="font-bold text-gray-900 text-[15px] leading-snug group-hover:text-brand transition-colors">Andai Tidak Menikah Dengannya</h3>
                    <p class="text-xs text-gray-500 font-medium mt-1">Promo Harga Spesial</p>
                </div>
                <div class="px-2 text-gray-300 group-hover:text-brand group-hover:translate-x-0.5 transition-all shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </button>

            <!-- 4. Memandang Setengah Isi Setengah Kosong (MSISK) -->
            <button onclick="openModal('Memandang Setengah Isi Setengah Kosong', 'https://cart.locrepublishing.com/order-msisk-quanta?discount_code=SAKA-C', 'SAKA-C', 'Cover_MSISK.jpg', 'https://i.ibb.co.com/jP1kgV6w/MSISK.jpg')" 
                class="group flex items-center w-full bg-white border-2 border-gray-100 p-3 rounded-2xl text-left hover:border-brand hover:shadow-md hover:bg-orange-50/30 transition-all duration-200">
                <img src="Cover_MSISK.jpg" 
                     onerror="this.onerror=null; this.src='https://i.ibb.co.com/jP1kgV6w/MSISK.jpg';" 
                     alt="Memandang Setengah Isi Setengah Kosong" 
                     class="w-[68px] h-[100px] object-cover rounded-xl shadow-sm shrink-0 bg-gray-100">
                <div class="ml-4 flex-1">
                    <span class="inline-block text-[11px] font-semibold uppercase tracking-wider text-brand bg-orange-50 px-2 py-0.5 rounded-md mb-1">Kode: SAKA-C</span>
                    <h3 class="font-bold text-gray-900 text-[15px] leading-snug group-hover:text-brand transition-colors">Memandang Setengah Isi Setengah Kosong</h3>
                    <p class="text-xs text-gray-500 font-medium mt-1">Edisi Quanta • Klaim Diskon</p>
                </div>
                <div class="px-2 text-gray-300 group-hover:text-brand group-hover:translate-x-0.5 transition-all shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </button>
            
        </div>
    </main>

    <!-- Modal / Popup -->
    <div id="orderModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 backdrop-blur-sm px-4 opacity-0 transition-opacity duration-300">
        <!-- Modal Content Box -->
        <div id="modalBox" class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 relative">
            
            <!-- Close icon top right -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full p-1.5 transition-colors z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Modal Header (Image, Badge & Title) -->
            <div class="flex flex-col items-center text-center mt-2 mb-6">
                <img id="modalImg" src="" alt="Cover Buku" class="w-28 h-40 object-cover rounded-xl shadow-md mb-3.5 bg-gray-100">
                <span id="modalBadge" class="text-[11px] font-semibold uppercase tracking-wider text-brand bg-orange-50 px-2.5 py-0.5 rounded-full mb-1.5">Kode Referal</span>
                <h2 id="modalTitle" class="text-lg font-bold text-gray-900 leading-snug px-2">Pesan Buku</h2>
            </div>
            
            <!-- Modal Body (Action Buttons) -->
            <div class="space-y-3 mb-2">
                <!-- Web Option -->
                <a id="btnWeb" href="#" target="_blank" class="flex justify-center items-center gap-2 w-full py-3.5 text-center text-white bg-brand hover:bg-[#c93d22] rounded-xl font-semibold shadow-md shadow-orange-200 transition-all hover:-translate-y-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                    </svg>
                    Pesan via Website
                </a>
                
                <!-- WhatsApp Option -->
                <a id="btnWa" href="#" target="_blank" class="w-full py-3.5 text-center text-white bg-[#25D366] hover:bg-[#20ba59] rounded-xl font-semibold flex justify-center items-center gap-2 shadow-md shadow-green-200 transition-all hover:-translate-y-0.5">
                    <!-- WhatsApp SVG Icon -->
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                    </svg>
                    Pesan via WhatsApp
                </a>
            </div>
            
            <button onclick="closeModal()" class="block w-full text-center text-gray-500 hover:text-gray-800 text-sm font-medium py-3 mt-2">
                Batal
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const modal = document.getElementById('orderModal');
        const modalBox = document.getElementById('modalBox');

        function openModal(title, webLink, refCode, localImgSrc, fallbackImgSrc) {
            // Update judul dan kode referal pada modal
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBadge').innerText = `Kode Diskon: ${refCode}`;
            
            // Set gambar dengan dukungan file lokal GitHub + fallback preview
            const modalImg = document.getElementById('modalImg');
            modalImg.onerror = function() {
                this.onerror = null;
                this.src = fallbackImgSrc;
            };
            modalImg.src = localImgSrc;
            
            // Set link untuk tombol Website
            document.getElementById('btnWeb').href = webLink;
            
            // Set link untuk tombol WhatsApp
            const waNumber = "6289699776077";
            const message = `Assalamualaikum, halo kak, saya ingin pesan buku ${title} dengan kode referal ${refCode}`;
            const encodedMessage = encodeURIComponent(message);
            document.getElementById('btnWa').href = `https://wa.me/${waNumber}?text=${encodedMessage}`;
            
            // Tampilkan modal dengan efek transisi
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            // Sembunyikan modal dengan transisi mundur
            modal.classList.add('opacity-0');
            modalBox.classList.add('scale-95');
            
            // Tunggu transisi selesai sebelum hidden (300ms sesuai durasi tailwind class)
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Menutup modal jika area di luar kotak putih (backdrop) diklik
        modal.addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
